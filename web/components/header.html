    <!-- Top Header (Universal Single-Row Desktop & Mobile) -->
    <header class="top-header">
      <div class="header-left-group">
        <button type="button" id="btnMobileMenuToggle" class="mobile-menu-btn d-none" aria-label="" title="" data-i18n-aria="header.openMenu" data-i18n-title="header.openMenu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="header-title">
          <h1 id="pageTitle" data-i18n="navigation.tabDashboard.title"></h1>
          <p id="pageSubtitle" data-i18n="navigation.tabDashboard.sub"></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm header-btn-icon" id="btnThemeToggle"
          data-tooltip="" data-i18n-tooltip="header.themeToggle" title="" data-i18n-title="header.themeTitle">
          <i class="fa-solid fa-moon text-cyan" id="themeIcon"></i>
        </button>
        <button class="btn btn-secondary btn-sm header-btn-icon" id="btnOpenAboutModal"
          data-tooltip="" data-i18n-tooltip="header.aboutTooltip" title="" data-i18n-title="header.aboutTitle">
          <i class="fa-solid fa-circle-info text-cyan"></i>
        </button>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="brandDetectPill" data-i18n="header.statusReady"></span>
        </div>
      </div>
    </header>
