<!-- ================= TAB 0: PREMIUM HOMEPAGE DASHBOARD ================= -->
<section id="tab-home" class="tool-tab active">

  <!-- Hero Welcome Banner -->
  <div class="home-hero-card">
    <div class="hero-content">
      <div class="hero-pill">
        <span class="hero-pill-dot"></span>
        <span data-i18n="home.heroPill"></span>
      </div>
      <h2 class="hero-title" data-i18n="home.heroTitle"></h2>
      <p class="hero-description" data-i18n="home.heroDesc"></p>
    </div>

    <!-- Hero Universal Fast Dropzone -->
    <div class="dropzone" id="homeHeroDropzone">
      <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
      <div class="dropzone-title" data-i18n="home.heroDropTitle"></div>
      <div class="dropzone-desc" data-i18n="home.heroDropSub"></div>
      <div class="dropzone-tags">
        <span class="dropzone-tag-pill">RW5 / RAW</span>
        <span class="dropzone-tag-pill">RINEX (.RNX/.OBS)</span>
        <span class="dropzone-tag-pill">NCZ / DXF</span>
        <span class="dropzone-tag-pill">KML / KMZ</span>
        <span class="dropzone-tag-pill">GeoJSON</span>
        <span class="dropzone-tag-pill">Netcad .DNS</span>
        <span class="dropzone-tag-pill">TXT / CSV</span>
      </div>
      <input type="file" id="inputHomeHeroFile" class="file-drop-input"
        accept=".rw5,.raw,.csv,.txt,.jxl,.dat,.o,.rnx,.crx,.obs,.ncn,.dns,.kml,.kmz,.geojson,.json" />
    </div>
  </div>

  <!-- Bento Grid of Tool Modules -->
  <div class="home-bento-grid">

    <!-- Bento Card 1: RTK & Ham Data -->
    <div class="card bento-card" data-launch-tab="tab-cadastre">

          <i class="fa-solid fa-table-cells"></i>
        </div>

        <span class="badge badge-cyan" data-i18n="home.rtkBadge"></span>
      </div>
      <h3 class="bento-title" data-i18n="home.rtkTitle"></h3>
      <p class="bento-desc" data-i18n="home.rtkDesc"></p>
      <div class="bento-features">
        <span><i class="fa-solid fa-check"></i> <span data-i18n="home.rtkFeat1"></span></span>
        <span><i class="fa-solid fa-check"></i> <span data-i18n="home.rtkFeat2"></span></span>
        <span><i class="fa-solid fa-check"></i> <span data-i18n="home.rtkFeat3"></span></span>
      </div>
      <div class="bento-footer">
        <button type="button" class="bento-action-link"><span data-i18n="home.openModule"></span> <i
